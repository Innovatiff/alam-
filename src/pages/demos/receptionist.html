<!--
title: Sample · AI receptionist
description: Interactive sample of the AI receptionist: simulated calls, live transcript, bookings into the calendar and call summaries.
bodyClass: demo
extraCss: assets/css/demo.css
extraJs: assets/js/demos/receptionist.js
demoName: Bloom Salon · AI receptionist
productSlug: ai-receptionist
-->
{{> head}}
{{> demo-bar}}
<main class="demo-main" id="main">
  <div class="ai-layout">
    <div class="stack">
      <div class="panel call-panel">
        <div class="panel-head"><h3><svg><use href="#i-headset"/></svg>Phone line · Bloom Salon</h3><span class="tag green"><i class="dot" style="width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block"></i> AI receptionist answering</span></div>
        <div class="call-sim" id="call-sim"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3><svg><use href="#i-message"/></svg>Ask the receptionist yourself</h3><span class="muted small">Text version of the same assistant</span></div>
        <div class="chat" id="chat"></div>
        <form class="chat-form" id="chat-form"><input class="input" id="chat-input" placeholder="Type a question, for example: are you open on Sunday?" autocomplete="off"><button class="btn btn-primary" type="submit"><svg><use href="#i-arrow-right"/></svg></button></form>
        <div class="row" id="chat-chips" style="margin-top:.6rem"></div>
      </div>
    </div>
    <div class="stack">
      <div class="kpi-grid" id="ai-kpis"></div>
      <div class="panel"><div class="panel-head"><h3><svg><use href="#i-calendar"/></svg>This week's appointments</h3><span class="muted small">Bookings made by the AI appear here instantly</span></div><div class="cal-grid" id="cal"></div></div>
      <div class="panel"><div class="panel-head"><h3><svg><use href="#i-phone"/></svg>Call log</h3><span class="muted small">Every call, with a transcript</span></div><div class="list" id="call-log"></div></div>
    </div>
  </div>
</main>
{{> demo-footer}}
