<!--
title: Muestra · Arma tu propio sistema
description: Elige tu tipo de negocio y los módulos que necesitas, y mira cómo se arma un sistema a tu medida. Envía el resultado como solicitud de cotización.
bodyClass: demo
extraCss: assets/css/demo.css
extraJs: assets/js/demos/custom.js
demoName: Arma tu propio sistema
productSlug: custom-software
-->
{{> head}}
{{> demo-bar}}
<main class="demo-main" id="main">
  <div class="builder">
    <div class="builder-config">
      <div class="panel" id="types-panel">
        <div class="panel-head"><h3><span class="step-badge">1</span>¿Qué tipo de negocio tienes?</h3></div>
        <div class="type-grid" id="types"></div>
      </div>
      <div class="panel" id="modules-panel">
        <div class="panel-head"><h3><span class="step-badge">2</span>¿Qué módulos necesitas?</h3><span class="muted small" id="mod-count"></span></div>
        <div class="mod-grid" id="modules"></div>
      </div>
      <div class="panel" id="details-panel">
        <div class="panel-head"><h3><span class="step-badge">3</span>Unos detalles más</h3></div>
        <div class="form-grid">
          <div class="field"><label>Sucursales</label><div class="seg" id="locations"><button type="button" data-v="1" class="on">1</button><button type="button" data-v="2">2</button><button type="button" data-v="3">3 o más</button></div></div>
          <div class="field"><label>Cajas / mostradores: <b id="term-label">1</b></label><input type="range" id="terminals" min="1" max="6" value="1" class="range"></div>
          <div class="field full"><label>Extras</label><div class="check-grid">
            <label class="check"><input type="checkbox" id="x-remote" checked> Acceso seguro desde casa</label>
            <label class="check"><input type="checkbox" id="x-backup"> Respaldo externo cifrado</label>
            <label class="check"><input type="checkbox" id="x-display"> Pantalla para el cliente</label>
            <label class="check"><input type="checkbox" id="x-multi"> Varios idiomas</label>
          </div></div>
        </div>
      </div>
    </div>
    <div class="builder-preview">
      <div class="preview-app device" id="preview"></div>
      <div class="panel summary" id="summary"></div>
    </div>
  </div>
</main>
{{> demo-footer}}
